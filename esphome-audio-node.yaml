esphome:
  name: esphome-audio-node
  friendly_name: ESPHome-Audio-Node
  project:
    name: "audio.node"
    version: "1.1"

logger:
  level: DEBUG
  baud_rate: 0
  logs:
    "*": WARN
    vfs_fat_sdmmc: DEBUG

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      disable_fatfs: false
      disable_vfs_support_dir: false
      include_builtin_idf_components:
        - fatfs
        - sdmmc
        - esp_driver_sdmmc

psram:
  mode: octal

external_components:
  - source:
      type: local
      path: components

# Enable Home Assistant API
api:
  encryption:
    key: !secret esphome_audio_node_ha_api_key

ota:
  - platform: esphome
    encryption:
      key: !secret esphome_audio_node_ha_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # manual IP added because the ESP is on a different network
  manual_ip:
    # Set this to the IP of the ESP
    static_ip: !secret esphome_audio_node_static_ip
    # Set this to the IP address of the router. Often ends with .1
    gateway: !secret esphome_audio_node_gateway
    # The subnet of the network. 255.255.255.0 works for most home networks.
    subnet: !secret esphome_audio_node_subnet
    dns1: !secret local_gateway
    dns2: 8.8.8.8  # öffentlicher Fallback

  power_save_mode: none

  on_connect:
    then:
      - lambda: |-
          id(wifi_connected) = true;
          // Reset status LED state after reconnection; safety script will update actual mode
          if (id(status_led_mode) == 2) id(status_led_mode) = 0;

  on_disconnect:
    then:
      - lambda: |-
          id(wifi_connected) = false;
          id(status_led_mode) = 2;

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "ESPHome-Audio-Node"
    password: !secret esphome_audio_node_ap_password

# Globale Variablen für Ihre Status-LED-Logik
globals:
  - id: wifi_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: status_led_mode
    type: int
    restore_value: no
    initial_value: '0'

# I2S Audio Bus Definition (nur die Clocks)
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO1   # LRCK / WS
    i2s_bclk_pin: GPIO2   # BCK / Bit Clock

# Speaker / Media Player Komponente (hier gehört der Daten-Pin hin)
speaker:
  - platform: i2s_audio
    id: my_speaker_component
    dac_type: external
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO14    # DIN / Data In des PCM5102A
    i2s_mode: primary
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit

microphone:
  - platform: i2s_audio
    id: ics43434_mic
    i2s_audio_id: i2s_out
    i2s_din_pin: GPIO21    # SD / DOUT des ICS-43434
    adc_type: external
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit

sd_wav_player:
  id: local_sd_audio
  speaker_id: my_speaker_component

binary_sensor:
  - platform: gpio
    name: "Bewegungsmelder"
    device_class: motion
    pin:
      number: GPIO43
      mode: INPUT
    on_press:
      then:
        - lambda: id(local_sd_audio).play_random();

media_player:
  - platform: speaker
    id: my_speaker
    announcement_pipeline:
      speaker: my_speaker_component
      format: WAV
      sample_rate: 16000
      num_channels: 1
    name: "ESP32 Audio Player"
    buffer_size: 100000

voice_assistant:
  microphone:
    microphone: ics43434_mic
    channels:
      - 0
  speaker: my_speaker_component
  use_wake_word: true

captive_portal:
