esphome:
  name: esphome-audio-node
  friendly_name: ESPHome-Audio-Node
  project:
    name: "audio.node"
    version: "1.1"

logger:
  level: WARN
  baud_rate: 0

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  flash_size: 16MB
  framework:
    type: esp-idf
  variant: ESP32S3

psram:
  mode: octal
  speed: 80MHz

# Enable Home Assistant API
api:
  encryption:
    key: !secret esphome_audio_node_ha_api_key

ota:
  - platform: esphome
    encryption:
      key: !secret esphome_audio_node_ha_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # manual IP added because the ESP is on a different network
  manual_ip:
    # Set this to the IP of the ESP
    static_ip: !secret esphome_audio_node_static_ip
    # Set this to the IP address of the router. Often ends with .1
    gateway: !secret esphome_audio_node_gateway
    # The subnet of the network. 255.255.255.0 works for most home networks.
    subnet: !secret esphome_audio_node_subnet
    dns1: !secret local_gateway
    dns2: 8.8.8.8  # öffentlicher Fallback

  power_save_mode: none

  on_connect:
    then:
      - lambda: |-
          id(wifi_connected) = true;
          // Reset status LED state after reconnection; safety script will update actual mode
          if (id(status_led_mode) == 2) id(status_led_mode) = 0;

  on_disconnect:
    then:
      - lambda: |-
          id(wifi_connected) = false;
          id(status_led_mode) = 2;

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "ESPHome-Audio-Node"
    password: !secret esphome_audio_node_ap_password

# Globale Variablen für Ihre Status-LED-Logik
globals:
  - id: wifi_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: status_led_mode
    type: int
    restore_value: no
    initial_value: '0'
  - id: random_sound_index
    type: int
    restore_value: no
    initial_value: '0'
  - id: audio_playing
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: led_blink_on
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: led_blink_last_change
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: led_blink_on_ms
    type: uint32_t
    restore_value: no
    initial_value: '50'
  - id: led_blink_off_ms
    type: uint32_t
    restore_value: no
    initial_value: '20'
  - id: led_blink_red
    type: uint8_t
    restore_value: no
    initial_value: '255'
  - id: led_blink_green
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: led_blink_blue
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: led_count
    type: uint8_t
    restore_value: no
    initial_value: '6'

# I2S Audio Bus Definition (nur die Clocks)
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO4    # LRCK / WS
    i2s_bclk_pin: GPIO5     # BCK / Bit Clock

# Speaker / Media Player Komponente (hier gehört der Daten-Pin hin)
speaker:
  - platform: i2s_audio
    id: my_speaker_component
    dac_type: external
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO6     # DIN / Data In des PCM5102A
    i2s_mode: primary
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit

microphone:
  - platform: i2s_audio
    id: ics43434_mic
    i2s_audio_id: i2s_out
    i2s_din_pin: GPIO7      # SD / DOUT des ICS-43434
    adc_type: external
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit

light:
  - platform: esp32_rmt_led_strip
    id: movement_leds
    name: "Bewegungs-LEDs"
    pin: GPIO8
    num_leds: 50
    chipset: WS2812
    channel_colors: GRB
    effects:
      - addressable_lambda:
          name: "Blinken"
          update_interval: 10ms
          lambda: |-
            const uint32_t now = millis();
            const uint32_t phase_duration = id(led_blink_on)
              ? id(led_blink_on_ms)
              : id(led_blink_off_ms);

            if (initial_run) {
              id(led_blink_on) = true;
              id(led_blink_last_change) = now;
            } else if (now - id(led_blink_last_change) >= phase_duration) {
              id(led_blink_on) = !id(led_blink_on);
              id(led_blink_last_change) = now;
            }

            const Color color = id(led_blink_on)
              ? Color(id(led_blink_red), id(led_blink_green), id(led_blink_blue))
              : Color(0, 0, 0);
            for (int i = 0; i < it.size(); i++) {
              it[i] = i < id(led_count) ? color : Color(0, 0, 0);
            }

select:
  - platform: template
    id: halloween_led_color
    name: "Halloween-LED Blink-Farbe"
    optimistic: true
    restore_value: false
    initial_option: "Rot"
    options:
      - "Rot"
      - "Orange"
      - "Gelb"
      - "Grün"
      - "Türkis"
      - "Blau"
      - "Violett"
      - "Weiß"
    on_value:
      - lambda: |-
          if (x == "Rot") {
            id(led_blink_red) = 255; id(led_blink_green) = 0; id(led_blink_blue) = 0;
          } else if (x == "Orange") {
            id(led_blink_red) = 255; id(led_blink_green) = 80; id(led_blink_blue) = 0;
          } else if (x == "Gelb") {
            id(led_blink_red) = 255; id(led_blink_green) = 255; id(led_blink_blue) = 0;
          } else if (x == "Grün") {
            id(led_blink_red) = 0; id(led_blink_green) = 255; id(led_blink_blue) = 0;
          } else if (x == "Türkis") {
            id(led_blink_red) = 0; id(led_blink_green) = 255; id(led_blink_blue) = 255;
          } else if (x == "Blau") {
            id(led_blink_red) = 0; id(led_blink_green) = 0; id(led_blink_blue) = 255;
          } else if (x == "Violett") {
            id(led_blink_red) = 180; id(led_blink_green) = 0; id(led_blink_blue) = 255;
          } else if (x == "Weiß") {
            id(led_blink_red) = 255; id(led_blink_green) = 255; id(led_blink_blue) = 255;
          }

number:
  - platform: template
    id: halloween_led_on_time
    name: "Halloween-LED Blink-AN-Zeit"
    unit_of_measurement: "ms"
    min_value: 20
    max_value: 5000
    step: 10
    optimistic: true
    initial_value: 50
    set_action:
      - lambda: id(led_blink_on_ms) = static_cast<uint32_t>(x);
  - platform: template
    id: halloween_led_off_time
    name: "Halloween-LED Blink-AUS-Zeit"
    unit_of_measurement: "ms"
    min_value: 20
    max_value: 5000
    step: 10
    optimistic: true
    initial_value: 20
    set_action:
      - lambda: id(led_blink_off_ms) = static_cast<uint32_t>(x);
  - platform: template
    id: halloween_led_count
    name: "Halloween-LED Anzahl"
    unit_of_measurement: "LEDs"
    mode: box
    min_value: 1
    max_value: 50
    step: 1
    optimistic: true
    initial_value: 50
    set_action:
      - lambda: id(led_count) = static_cast<uint8_t>(x);

switch:
  - platform: template
    id: halloween_music_enabled
    name: "Halloween-Musik"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_off_action:
      - media_player.stop: my_speaker

  - platform: template
    id: halloween_led_enabled
    name: "Halloween-LED"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_off_action:
      - light.turn_off: movement_leds
    turn_on_action:
      - if:
            condition:
              lambda: return id(audio_playing);
            then:
              - light.turn_on:
                  id: movement_leds
                  effect: "Blinken"

binary_sensor:
  - platform: gpio
    name: "Bewegungsmelder"
    device_class: motion
    pin:
      number: GPIO21
      mode: INPUT
    on_press:
      then:
        - if:
            condition:
              switch.is_on: halloween_music_enabled
            then:
              - lambda: id(random_sound_index) = random_uint32() % 10;
              - if:
                  condition:
                    lambda: return id(random_sound_index) == 0;
                  then:
                    - media_player.speaker.play_on_device_media_file:
                        media_file: files_1
                        announcement: true
              - if:
                  condition:
                    lambda: return id(random_sound_index) == 1;
                  then:
                    - media_player.speaker.play_on_device_media_file:
                        media_file: files_2
                        announcement: true
              - if:
                  condition:
                    lambda: return id(random_sound_index) == 2;
                  then:
                    - media_player.speaker.play_on_device_media_file:
                        media_file: files_3
                        announcement: true
              - if:
                  condition:
                    lambda: return id(random_sound_index) == 3;
                  then:
                    - media_player.speaker.play_on_device_media_file:
                        media_file: files_4
                        announcement: true
              - if:
                  condition:
                    lambda: return id(random_sound_index) == 4;
                  then:
                    - media_player.speaker.play_on_device_media_file:
                        media_file: files_5
                        announcement: true
              - if:
                  condition:
                    lambda: return id(random_sound_index) == 5;
                  then:
                    - media_player.speaker.play_on_device_media_file:
                        media_file: files_6
                        announcement: true
              - if:
                  condition:
                    lambda: return id(random_sound_index) == 6;
                  then:
                    - media_player.speaker.play_on_device_media_file:
                        media_file: files_7
                        announcement: true
              - if:
                  condition:
                    lambda: return id(random_sound_index) == 7;
                  then:
                    - media_player.speaker.play_on_device_media_file:
                        media_file: files_8
                        announcement: true
              - if:
                  condition:
                    lambda: return id(random_sound_index) == 8;
                  then:
                    - media_player.speaker.play_on_device_media_file:
                        media_file: files_9
                        announcement: true
              - if:
                  condition:
                    lambda: return id(random_sound_index) == 9;
                  then:
                    - media_player.speaker.play_on_device_media_file:
                        media_file: files_10
                        announcement: true

media_player:
  - platform: speaker
    id: my_speaker
    announcement_pipeline:
      speaker: my_speaker_component
      format: MP3
      sample_rate: 16000
      num_channels: 1
    name: "ESP32 Audio Player"
    buffer_size: 8192
    on_play:
      - lambda: id(audio_playing) = true;
      - if:
          condition:
            switch.is_on: halloween_led_enabled
          then:
            - light.turn_on:
                id: movement_leds
                effect: "Blinken"
    on_announcement:
      - lambda: id(audio_playing) = true;
      - if:
          condition:
            switch.is_on: halloween_led_enabled
          then:
            - light.turn_on:
                id: movement_leds
                effect: "Blinken"
    on_pause:
      - lambda: id(audio_playing) = false;
      - light.turn_off: movement_leds
    on_idle:
      - lambda: id(audio_playing) = false;
      - light.turn_off: movement_leds
    files:
      - id: files_1
        file: "https://jotid-iot-home.duckdns.org:8123/local/halloween/witch-laugh.mp3"
      - id: files_2
        file: "https://jotid-iot-home.duckdns.org:8123/local/halloween/evil-laugh.mp3"
      - id: files_3
        file: "https://jotid-iot-home.duckdns.org:8123/local/halloween/evil-witch-laugh.mp3"
      - id: files_4
        file: "https://jotid-iot-home.duckdns.org:8123/local/halloween/wolf-howl.mp3"
      - id: files_5
        file: "https://jotid-iot-home.duckdns.org:8123/local/halloween/wolf-howling.mp3"
      - id: files_6
        file: "https://jotid-iot-home.duckdns.org:8123/local/halloween/ghost-voice.mp3"
      - id: files_7
        file: "https://jotid-iot-home.duckdns.org:8123/local/halloween/creepy-bell.mp3"
      - id: files_8
        file: "https://jotid-iot-home.duckdns.org:8123/local/halloween/impact.mp3"
      - id: files_9
        file: "https://jotid-iot-home.duckdns.org:8123/local/halloween/halloween-music.mp3"
      - id: files_10
        file: "https://jotid-iot-home.duckdns.org:8123/local/halloween/funny-pumpkin.mp3"


voice_assistant:
  microphone:
    microphone: ics43434_mic
    channels:
      - 0
  speaker: my_speaker_component
  use_wake_word: true

captive_portal:
