esphome:
  name: esphome-audio-node
  friendly_name: ESPHome-Audio-Node
  project:
    name: "audio.node"
    version: "1.1"

logger:
  level: WARN
  baud_rate: 0

esp32:
  board: esp32dev
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
  variant: ESP32

# Enable Home Assistant API
api:
  encryption:
    key: !secret esphome_audio_node_ha_api_key

ota:
  - platform: esphome
    encryption:
      key: !secret esphome_audio_node_ha_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # manual IP added because the ESP is on a different network
  manual_ip:
    # Set this to the IP of the ESP
    static_ip: !secret esphome_audio_node_static_ip
    # Set this to the IP address of the router. Often ends with .1
    gateway: !secret esphome_audio_node_gateway
    # The subnet of the network. 255.255.255.0 works for most home networks.
    subnet: !secret esphome_audio_node_subnet
    dns1: !secret local_gateway
    dns2: 8.8.8.8  # öffentlicher Fallback

  power_save_mode: none

  on_connect:
    then:
      - lambda: |-
          id(wifi_connected) = true;
          // Reset status LED state after reconnection; safety script will update actual mode
          if (id(status_led_mode) == 2) id(status_led_mode) = 0;

  on_disconnect:
    then:
      - lambda: |-
          id(wifi_connected) = false;
          id(status_led_mode) = 2;

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "ESPHome-Audio-Node"
    password: !secret esphome_audio_node_ap_password

# Globale Variablen für Ihre Status-LED-Logik
globals:
  - id: wifi_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: status_led_mode
    type: int
    restore_value: no
    initial_value: '0'
  - id: random_sound_index
    type: int
    restore_value: no
    initial_value: '0'

# I2S Audio Bus Definition (nur die Clocks)
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO25   # LRCK / WS
    i2s_bclk_pin: GPIO26   # BCK / Bit Clock

# Speaker / Media Player Komponente (hier gehört der Daten-Pin hin)
speaker:
  - platform: i2s_audio
    id: my_speaker_component
    dac_type: external
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO27    # DIN / Data In des PCM5102A
    i2s_mode: primary
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit

microphone:
  - platform: i2s_audio
    id: ics43434_mic
    i2s_audio_id: i2s_out
    i2s_din_pin: GPIO33    # SD / DOUT des ICS-43434
    adc_type: external
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit

binary_sensor:
  - platform: gpio
    name: "Bewegungsmelder"
    device_class: motion
    pin:
      number: GPIO22
      mode: INPUT
    on_press:
      then:
        - lambda: id(random_sound_index) = random_uint32() % 10;
        - if:
            condition:
              lambda: return id(random_sound_index) == 0;
            then:
              - media_player.speaker.play_on_device_media_file:
                  media_file: files_1
                  announcement: true
        - if:
            condition:
              lambda: return id(random_sound_index) == 1;
            then:
              - media_player.speaker.play_on_device_media_file:
                  media_file: files_2
                  announcement: true
        - if:
            condition:
              lambda: return id(random_sound_index) == 2;
            then:
              - media_player.speaker.play_on_device_media_file:
                  media_file: files_3
                  announcement: true
        - if:
            condition:
              lambda: return id(random_sound_index) == 3;
            then:
              - media_player.speaker.play_on_device_media_file:
                  media_file: files_4
                  announcement: true
        - if:
            condition:
              lambda: return id(random_sound_index) == 4;
            then:
              - media_player.speaker.play_on_device_media_file:
                  media_file: files_5
                  announcement: true
        - if:
            condition:
              lambda: return id(random_sound_index) == 5;
            then:
              - media_player.speaker.play_on_device_media_file:
                  media_file: files_6
                  announcement: true
        - if:
            condition:
              lambda: return id(random_sound_index) == 6;
            then:
              - media_player.speaker.play_on_device_media_file:
                  media_file: files_7
                  announcement: true
        - if:
            condition:
              lambda: return id(random_sound_index) == 7;
            then:
              - media_player.speaker.play_on_device_media_file:
                  media_file: files_8
                  announcement: true
        - if:
            condition:
              lambda: return id(random_sound_index) == 8;
            then:
              - media_player.speaker.play_on_device_media_file:
                  media_file: files_9
                  announcement: true
        - if:
            condition:
              lambda: return id(random_sound_index) == 9;
            then:
              - media_player.speaker.play_on_device_media_file:
                  media_file: files_10
                  announcement: true

media_player:
  - platform: speaker
    id: my_speaker
    announcement_pipeline:
      speaker: my_speaker_component
      format: WAV
      sample_rate: 16000
      num_channels: 1
    name: "ESP32 Audio Player"
    buffer_size: 8192
    files:
      - id: files_1
        file: "https://jotid-iot-home.duckdns.org:8123/local/halloween/witch-laugh.mp3"
      - id: files_2
        file: "https://jotid-iot-home.duckdns.org:8123/local/halloween/evil-laugh.mp3"
      - id: files_3
        file: "https://jotid-iot-home.duckdns.org:8123/local/halloween/evil-witch-laugh.mp3"
      - id: files_4
        file: "https://jotid-iot-home.duckdns.org:8123/local/halloween/wolf-howl.mp3"
      - id: files_5
        file: "https://jotid-iot-home.duckdns.org:8123/local/halloween/wolf-howling.mp3"
      - id: files_6
        file: "https://jotid-iot-home.duckdns.org:8123/local/halloween/ghost-voice.mp3"
      - id: files_7
        file: "https://jotid-iot-home.duckdns.org:8123/local/halloween/creepy-bell.mp3"
